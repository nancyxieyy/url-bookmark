<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Bookmark</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">CAPTURE</p>
        <h1>URL Bookmark</h1>
      </div>
      <nav><a id="manage-link" href="#" target="_blank" title="打开管理页面">管理 ↗</a><button id="settings-link" type="button">设置</button></nav>
    </header>

    <section class="page-card">
      <div class="favicon-placeholder">◇</div>
      <div>
        <h2 id="page-title">正在读取当前网页…</h2>
        <p id="page-url"></p>
      </div>
    </section>

    <div id="status" class="status success" role="status" aria-live="polite">正在本地读取当前页面…</div>
    <section id="capture-summary" class="capture-summary" hidden>
      <div class="capture-result-line">
        <strong id="capture-method">浏览器正文</strong>
        <span id="capture-length"></span>
      </div>
      <p id="capture-source"></p>
      <div id="fallback-actions" class="fallback-actions" hidden>
        <button id="url-only-button" type="button">只收藏网址</button>
      </div>
    </section>
    <button id="preview-button" class="primary-button" type="button" hidden>
      <span>重新读取页面</span><span>→</span>
    </button>

    <form id="bookmark-form" hidden>
      <button id="ai-suggestions-button" class="secondary-button" type="button" hidden>
        <span>生成 AI 推荐</span><span>＋</span>
      </button>
      <div class="tag-select" data-tag-select>
        <label class="tag-select-label" id="popup-tags-label">标签 <span>可多选</span></label>
        <button
          class="tag-select-trigger"
          type="button"
          aria-expanded="false"
          aria-controls="popup-tags-menu"
          aria-labelledby="popup-tags-label popup-tags-summary"
          data-tag-trigger
        >
          <span id="popup-tags-summary" data-tag-summary>选择标签</span>
          <span class="tag-select-chevron" aria-hidden="true">⌄</span>
        </button>
        <div class="tag-select-menu" id="popup-tags-menu" data-tag-menu hidden>
          <label class="tag-new-row" for="popup-new-tag">
            <span class="tag-new-icon" aria-hidden="true">＋</span>
            <input id="popup-new-tag" maxlength="50" placeholder="添加新的标签" autocomplete="off" data-new-tag>
          </label>
          <section class="tag-menu-recommender" id="recommended-section" hidden>
            <div class="tag-recommender-heading">
              <div><strong>AI 推荐</strong><small>点击后加入标签</small></div>
            </div>
            <div id="recommended-tags" class="tag-recommend-list"></div>
          </section>
          <div class="tag-option-list" id="tag-options" data-tag-options></div>
          <div class="tag-menu-footer">
            <button type="button" data-tag-done>完成</button>
          </div>
        </div>
      </div>

      <label for="notes">备注 <span>可选</span></label>
      <textarea id="notes" name="notes" maxlength="5000" placeholder="写下为什么收藏、之后要做什么…"></textarea>

      <button id="save-button" type="submit">
        <span>收藏</span><span>→</span>
      </button>
      <p class="shortcut">⌘/Ctrl + Shift + S 可直接保存到 Inbox</p>
    </form>

    <section class="recent-section">
      <div class="recent-heading"><h3>最近收藏</h3><span>最近 3 条</span></div>
      <div id="recent-list" class="recent-list"><span class="muted">正在加载…</span></div>
    </section>
  </main>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
