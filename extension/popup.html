<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Bookmark</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">CAPTURE</p>
        <h1>URL Bookmark</h1>
      </div>
      <a href="http://127.0.0.1:8000" target="_blank" title="打开管理页面">管理 ↗</a>
    </header>

    <section class="page-card">
      <div class="favicon-placeholder">◇</div>
      <div>
        <h2 id="page-title">正在读取当前网页…</h2>
        <p id="page-url"></p>
      </div>
    </section>

    <form id="bookmark-form">
      <fieldset>
        <legend>已有标签</legend>
        <div id="existing-tags" class="tag-list">
          <span class="muted">正在加载…</span>
        </div>
      </fieldset>

      <label for="new-tags">新标签 <span>使用逗号分隔</span></label>
      <input id="new-tags" name="new-tags" placeholder="AI, 稍后读" autocomplete="off">

      <button id="save-button" type="submit">
        <span>保存当前网页</span><span>→</span>
      </button>
      <p class="shortcut">⌘/Ctrl + Shift + S 可直接保存到 Inbox</p>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
