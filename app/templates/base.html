<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}URL Bookmark{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">URL Bookmark</a>
    <span>把值得留下的网页，安静地收好。</span>
  </header>
  <main class="container">
    {% if request.query_params.get('message') %}
      <div class="notice success">{{ request.query_params.get('message') }}</div>
    {% endif %}
    {% if request.query_params.get('error') %}
      <div class="notice error">{{ request.query_params.get('error') }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='/tag-selector.js') }}" defer></script>
</body>
</html>
