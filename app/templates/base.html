<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}URL Bookmark{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">URL Bookmark</a>
    <span class="tagline">把值得留下的网页，安静地收好。</span>
    <nav class="topbar-links"><a href="/settings">设置</a><a href="/trash">回收站</a></nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='/tag-selector.js') }}" defer></script>
</body>
</html>
