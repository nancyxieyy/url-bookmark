<div class="tag-select" data-tag-select>
  <label class="tag-select-label" id="{{ selector_id }}-label">标签 <small>可多选</small></label>
  <button
    class="tag-select-trigger"
    type="button"
    aria-expanded="false"
    aria-controls="{{ selector_id }}-menu"
    aria-labelledby="{{ selector_id }}-label {{ selector_id }}-summary"
    data-tag-trigger
  >
    <span id="{{ selector_id }}-summary" data-tag-summary>选择标签</span>
    <span class="tag-select-chevron" aria-hidden="true">⌄</span>
  </button>
  <div class="tag-select-menu" id="{{ selector_id }}-menu" data-tag-menu hidden>
    <label class="tag-new-row" for="{{ selector_id }}-new">
      <span class="tag-new-icon" aria-hidden="true">＋</span>
      <input
        id="{{ selector_id }}-new"
        name="tags"
        maxlength="50"
        placeholder="添加新的标签"
        autocomplete="off"
        data-new-tag
      >
    </label>
    <div class="tag-option-list" data-tag-options>
      {% for choice in tag_choices %}
      <label class="tag-menu-option">
        <input type="checkbox" name="tag_choices" value="{{ choice }}" data-tag-option {% if choice in selected_tags %}checked{% endif %}>
        <span class="tag-check" aria-hidden="true">✓</span>
        <span>{{ choice }}</span>
      </label>
      {% endfor %}
    </div>
    <div class="tag-menu-footer">
      <button type="button" data-tag-done>完成</button>
    </div>
  </div>
</div>
